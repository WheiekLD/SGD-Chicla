{{ form.non_field_errors }}
<div class="form-grid">
{% for field in form %}
  <div class="form-field{% if field.name == 'subject' or field.name == 'note' %} wide{% endif %}">
    {{ field.label_tag }}
    {{ field }}
    {% if field.help_text %}<small id="{{ field.auto_id }}_helptext">{{ field.help_text }}</small>{% endif %}
    {{ field.errors }}
  </div>
{% endfor %}
</div>
